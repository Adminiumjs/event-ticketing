# SPDX-License-Identifier: AGPL-3.0-only
#
# Event Ticketing's own checks — beside `ci.yml`, which is the fleet's
# synced workflow (build, the suite, the manifest) and is never hand-edited.
#
# What only this repo needs, and why each is here:
#
#   the contract   `src/contract/contract.test.ts`: this repo's manifest and
#                  sample installed on a BUILT Adminium, with Invoices &
#                  Receipts, on SQLite, Postgres and MySQL — install, the
#                  sample at 16:30 on 28 July, every show's money and every
#                  order's total, the box office's counts, an order through
#                  the public API, the door's check-in conditions, the sample
#                  removed. Here `ADMINIUM_REQUIRE_CONTRACT=1` runs it and
#                  makes a skip a failure, so it cannot go quietly green.
#   drift          the manifest validator this repo keeps a copy of, and the
#                  untranslated ledger — each fails when it no longer matches
#                  its source.
#   the builds     both hosted sides and the website's demo (`demo.json`).
#
# Both product checkouts are moved out of the workspace before the suite
# runs: vitest collects every `*.test.ts` under the repo root, and the
# products' own suites are not this repo's to run.
#
# WHICH ADMINIUM. The contract runs against a NAMED Adminium, never whatever
# its default branch is that day: by default the release tag this app's
# manifest floors on (`compatibility.minAdminiumVersion` → `v<floor>`), so a
# pull request proves the floor it ships and a core commit cannot turn this
# check red or green on its own. A manual run may name another ref (a release
# candidate, a branch) through the `adminium_ref` input, or the repository
# variable `ADMINIUM_REF` may hold one for every run; the add-ons likewise
# (`add_ons_ref` / `ADD_ONS_REF`, their default branch when unset).

name: contract

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      adminium_ref:
        description: "Adminium ref to prove against (default: v<the manifest's minAdminiumVersion>)"
        required: false
        default: ""
      add_ons_ref:
        description: "add-ons ref (default: its default branch)"
        required: false
        default: ""

jobs:
  contract:
    name: three-engine contract & drift
    runs-on: ubuntu-latest
    timeout-minutes: 45

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s --health-timeout 5s --health-retries 20
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ALLOW_EMPTY_PASSWORD: "yes"
        ports: ["3306:3306"]
        options: >-
          --health-cmd "mysqladmin ping -h 127.0.0.1"
          --health-interval 5s --health-timeout 5s --health-retries 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      # The input, else the repository variable, else the release this app floors on.
      - name: Which Adminium
        id: refs
        env:
          INPUT_ADMINIUM: ${{ github.event.inputs.adminium_ref || vars.ADMINIUM_REF || '' }}
          INPUT_ADD_ONS: ${{ github.event.inputs.add_ons_ref || vars.ADD_ONS_REF || '' }}
        run: |
          floor=$(node -p "require('./manifest.json').compatibility.minAdminiumVersion")
          case "$floor" in ''|undefined) echo "manifest.json names no minAdminiumVersion" >&2; exit 1 ;; esac
          echo "adminium=${INPUT_ADMINIUM:-v$floor}" >> "$GITHUB_OUTPUT"
          echo "add_ons=$INPUT_ADD_ONS" >> "$GITHUB_OUTPUT"
          echo "Adminium: ${INPUT_ADMINIUM:-v$floor} · add-ons: ${INPUT_ADD_ONS:-default branch}"

      - name: Check out Adminium
        uses: actions/checkout@v4
        with:
          repository: MoSofi/Adminium
          ref: ${{ steps.refs.outputs.adminium }}
          path: .adminium-product

      - name: Check out the add-ons
        uses: actions/checkout@v4
        with:
          repository: Adminiumjs/add-ons
          ref: ${{ steps.refs.outputs.add_ons }}
          path: .add-ons

      # The e2e boot script serves the built server and the built dashboard, on
      # the engine it is asked for — the same composition `adminium start` runs.
      - name: Build Adminium (the server, the dashboard, the e2e boot)
        run: |
          cd .adminium-product
          corepack enable
          pnpm install --frozen-lockfile
          pnpm turbo run build --filter="@adminium/e2e..."

      - name: Build the add-ons
        run: |
          cd .add-ons
          npm ci
          npm run build

      - name: Move both checkouts out of the workspace
        run: |
          mv "$GITHUB_WORKSPACE/.adminium-product" "$RUNNER_TEMP/adminium-product"
          mv "$GITHUB_WORKSPACE/.add-ons" "$RUNNER_TEMP/add-ons"

      - name: Types
        run: npx tsc -b

      - name: The suite, with the contract on three engines
        env:
          ADMINIUM_REPO: ${{ runner.temp }}/adminium-product
          ADD_ONS_REPO: ${{ runner.temp }}/add-ons
          ADMINIUM_REQUIRE_CONTRACT: "1"
          ADMINIUM_REQUIRE_VALIDATOR: "true"
          TEST_POSTGRES_URL: postgres://postgres:postgres@127.0.0.1:5432/postgres
          TEST_MYSQL_URL: mysql://root@127.0.0.1:3306
        run: npx vitest run

      - name: The copies of other repos' files
        env:
          ADMINIUM_REPO: ${{ runner.temp }}/adminium-product
        run: |
          node scripts/sync-manifest-validator.mjs --check
          node scripts/untranslated.mjs --check

      - name: Both hosted sides, and the website's demo
        run: |
          npm run build:surface
          npm run build:demo
          test -f dist/demo.json
