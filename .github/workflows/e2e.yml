#
# The browser pass on the demo build (`npm run e2e`, `playwright.config.ts`).
#
# It needs no Adminium: the demo runs its own in the browser, so Playwright
# builds it (`build:demo`) and serves it with `vite preview` on this runner.
# Beside `ci.yml` (the fleet's synced workflow, never hand-edited) and
# `contract.yml` (the three-engine contract), because only this repo has it.

name: e2e

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  e2e:
    name: browser pass (demo)
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: The browser pass
        env:
          E2E_DEMO_PORT: "8663"
        run: npm run e2e

      - name: Keep the report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-results
          path: e2e-results/
          if-no-files-found: ignore
